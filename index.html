<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Destroy Squares · Responsive Lime Update</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{background:#111;color:#fff;font-family:Arial,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
h1{font-size:clamp(28px,7vw,56px);color:#f22;margin:10px;text-shadow:0 0 15px red}
h2{font-size:clamp(14px,2.4vw,22px);color:#ddd;font-weight:normal;margin:5px 0}
button{background:#d40000;color:#fff;border:2px solid #f44;padding:14px 35px;font-size:clamp(16px,2.2vw,22px);cursor:pointer;border-radius:6px;margin:10px;touch-action:manipulation}
button:hover{background:#f22}
#menu{z-index:20}
#highscoreText{font-size:clamp(16px,2.2vw,24px);color:#ffd700;margin:15px}
#gameScreen{display:none;position:absolute;inset:0}
#top{
  height:clamp(50px,8vh,75px);
  background:#1c1c1c;
  border-bottom:2px solid #444;
  display:flex;
  align-items:center;
  justify-content:space-around;
  font-size:clamp(12px,1.6vw,20px);
  position:relative;
  z-index:5;
  padding:0 6px;
  gap:4px;
  white-space:nowrap;
}
#game{position:relative;width:100vw;height:calc(100% - clamp(50px,8vh,75px));overflow:hidden}
#timer{
  position:absolute;left:12px;bottom:10px;
  font-size:clamp(12px,1.5vw,18px);
  color:#fff;background:rgba(0,0,0,.55);
  padding:6px 10px;border:1px solid #555;border-radius:5px;
  z-index:10;pointer-events:none;
}
#notification{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-size:clamp(14px,2vw,24px);font-weight:bold;color:#ffd700;
  text-shadow:0 0 10px #ff8c00;background:rgba(0,0,0,.7);
  padding:8px 16px;border-radius:6px;opacity:0;pointer-events:none;
  z-index:15;transition:opacity .25s;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
#chancePanel{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:clamp(120px,17vw,200px);
  background:rgba(0,0,0,.78);border:1px solid #555;border-radius:6px;
  padding:8px 10px;
  font-size:clamp(10px,1.2vw,14px);
  line-height:1.5;z-index:1;pointer-events:none!important;user-select:none;
}
#chancePanel h3{margin:0 0 5px;color:#ffd700;font-size:clamp(12px,1.4vw,16px)}
.enemy{
  pointer-events:auto;position:absolute;cursor:crosshair;
  transition:transform .08s;z-index:12;touch-action:manipulation;
  overflow:visible;
}
.enemy:hover{transform:scale(1.08)}

.red{background:#e00000;border:2px solid #ff5555;box-shadow:0 0 12px #f00}
.orange{background:#f07800;border:2px solid #ffb347;box-shadow:0 0 18px #ff7b00}
.purple{background:#8b20d9;border:2px solid #d58aff;box-shadow:0 0 18px #a020f0}
.green{background:#16d64b;border:2px solid #8aff9b;box-shadow:0 0 16px #16d64b}
.lime{background:#9acd32;border:2px solid #d4ff70;box-shadow:0 0 26px #b3ff3b}

.teleportFX{position:absolute;border:3px solid #d58aff;border-radius:50%;pointer-events:none;animation:tele .45s ease-out forwards}
@keyframes tele{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.8)}}

.healFX{position:absolute;border:3px solid #b3ff3b;border-radius:50%;pointer-events:none;animation:healRing .6s ease-out forwards;box-shadow:0 0 22px #b3ff3b inset}
@keyframes healRing{
  0%{opacity:1;transform:scale(.4);box-shadow:0 0 10px #b3ff3b}
  100%{opacity:0;transform:scale(1.6);box-shadow:0 0 40px #b3ff3b}
}
.healCross{
  position:absolute;color:#d4ff70;font-weight:bold;pointer-events:none;
  text-shadow:0 0 12px #b3ff3b;animation:healFloat .9s ease-out forwards;z-index:20;
}
@keyframes healFloat{
  0%{opacity:1;transform:translateY(0) scale(.6)}
  100%{opacity:0;transform:translateY(-45px) scale(1.2)}
}

.health{
  position:absolute;left:0;width:100%;background:#333;border:1px solid #111;
  pointer-events:none;
}
.healthFill{height:100%;background:#00e83b;width:100%;pointer-events:none}
#loseScreen{display:none;z-index:30}
#loseScreen p{font-size:clamp(14px,2vw,25px);margin:6px 0}
#finalScore,#loseHighscore{color:#ffd700}
</style>
</head>
<body>
<div id="menu" class="screen">
<h1>DESTROY SQUARES</h1>
<h2>Destroy the squares before 50 are alive!</h2>
<div id="highscoreText">Highscore: 0</div>
<button onclick="startGame()">START</button>
</div>

<div id="gameScreen">
<div id="top">
<div>Score: <span id="score">0</span></div>
<div>Alive: <span id="alive">0</span>/50</div>
<div>Damage: <span id="damage">1</span></div>
<div id="spawnText">Spawn: 3s</div>
</div>
<div id="game"><div id="timer">Time: 00:00</div><div id="notification"></div><div id="chancePanel"><h3>Spawn chances</h3><div id="chanceList"></div></div></div>
</div>

<div id="loseScreen" class="screen">
<h1>You lost!</h1>
<p>50 red squares were alive.</p>
<p>Score: <span id="finalScore">0</span></p>
<p>Highscore: <span id="loseHighscore">0</span></p>
<button onclick="goToMenu()">GO TO MENU</button>
</div>

<script>
/* ============================================================
   ELEMENT REFERENCES
   ============================================================ */
const menu=document.getElementById("menu");
const gameScreen=document.getElementById("gameScreen");
const loseScreen=document.getElementById("loseScreen");
const game=document.getElementById("game");
const scoreEl=document.getElementById("score");
const aliveEl=document.getElementById("alive");
const highscoreText=document.getElementById("highscoreText");
const finalScoreEl=document.getElementById("finalScore");
const loseHighscoreEl=document.getElementById("loseHighscore");
let timerEl=document.getElementById("timer");
let notificationEl=document.getElementById("notification");
let chanceListEl=null;
let spawnTextEl=document.getElementById("spawnText");

/* ============================================================
   GAME STATE
   ============================================================ */
let score=0,damage=1,enemies=[],gameOver=false,spawnTimer=null;
let gameStartTime=0, timerInterval=null, notificationTimeout=null, notifiedMinutes={};
let audioCtx=null, musicTimer=null, musicStep=0;

/* Hit cooldown per enemy: 500ms. Prevents double-fire from
   touchstart + click, and stops accidental double-taps. */
const HIT_COOLDOWN_MS = 500;

/* ============================================================
   RESPONSIVE SCALING SYSTEM
   ============================================================ */
const BASE_W = 1200;
const BASE_H = 800;
const FLOOR = 0.55;
const BLEND_START = 0.7;
const MAX_SCALE = 2.6;

let SCALE = 1;
let scaledSizes = {};

function getGameArea(){
  const w = game.clientWidth  || window.innerWidth;
  const h = game.clientHeight || (window.innerHeight - 75);
  return { w, h };
}

function recomputeScale(){
  const area = getGameArea();
  const scaleW = area.w / BASE_W;
  const scaleH = area.h / BASE_H;
  let s = Math.min(scaleW, scaleH);

  if(s < BLEND_START){
    const t = s / BLEND_START;
    s = FLOOR + (BLEND_START - FLOOR) * t;
  }

  s = Math.max(FLOOR, Math.min(s, MAX_SCALE));
  SCALE = s;

  scaledSizes = {
    red:    { size: Math.max(24, Math.round(42 * SCALE)), health: 3,  points: 1  },
    orange: { size: Math.max(32, Math.round(58 * SCALE)), health: 6,  points: 3  },
    purple: { size: Math.max(26, Math.round(48 * SCALE)), health: 5,  points: 8  },
    green:  { size: Math.max(18, Math.round(28 * SCALE)), health: 2,  points: 10 },
    lime:   { size: Math.max(40, Math.round(72 * SCALE)), health: 10, points: 25 }
  };
}

function applyScaleToDOM(){
  enemies.forEach(data=>{
    const s = scaledSizes[data.kind].size;
    data.size = s;
    data.element.style.width  = s+'px';
    data.element.style.height = s+'px';

    const maxX = Math.max(0, game.clientWidth  - s);
    const maxY = Math.max(0, game.clientHeight - s - Math.round(20*SCALE));
    const curX = parseFloat(data.element.style.left) || 0;
    const curY = parseFloat(data.element.style.top)  || 0;
    data.element.style.left = Math.min(Math.max(0, curX), maxX)+'px';
    data.element.style.top  = Math.min(Math.max(0, curY), maxY)+'px';

    data.healthBar.style.height = Math.max(4, Math.round(7*SCALE))+'px';
    data.healthBar.style.bottom = (-Math.max(8, Math.round(15*SCALE)))+'px';
  });
}

let resizeTimeout=null;
function handleResize(){
  clearTimeout(resizeTimeout);
  resizeTimeout=setTimeout(()=>{
    recomputeScale();
    applyScaleToDOM();
  },120);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', ()=>setTimeout(handleResize,300));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', handleResize);
}
document.addEventListener('fullscreenchange', ()=>setTimeout(handleResize,150));

/* ============================================================
   AUDIO
   ============================================================ */
function startMusic(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==="suspended") audioCtx.resume();
 clearInterval(musicTimer);
 musicStep=0;
 musicTimer=setInterval(playMusicStep,250);
 playMusicStep();
}
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; }
function tone(freq,duration,type="square",volume=.045){
 if(!audioCtx)return;
 const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
 osc.type=type; osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);
 osc.start();osc.stop(audioCtx.currentTime+duration);
}
function playMusicStep(){
 const step=musicStep%16;
 const bass=[55,55,73.42,55,65.41,65.41,82.41,65.41][Math.floor(step/2)];
 if(step%2===0)tone(bass,.18,"sawtooth",.06);
 if([0,4,8,12].includes(step))tone(110,.06,"sine",.08);
 if([2,6,10,14].includes(step))tone(220,.035,"square",.025);
 musicStep++;
}

/* ============================================================
   UI
   ============================================================ */
const MAX_ALIVE=50;
function getHighscore(){return Number(localStorage.getItem("destroySquaresHighscore"))||0}
function updateMenu(){highscoreText.textContent="Highscore: "+getHighscore()}
function updateUI(){scoreEl.textContent=score;aliveEl.textContent=enemies.length}

function getSpawnChances(){
 const minutes=Math.floor((Date.now()-gameStartTime)/60000);
 const orange=Math.min(.01+minutes*.01,.49);
 const purple=Math.min(minutes*.005,.25);
 const green=Math.min(Math.max(0,minutes-1)*.005,.25);
 const lime=Math.min(Math.max(0,minutes-2)*0.0015, 0.08);
 const used=orange+purple+green+lime;
 const red=Math.max(0, 1-used);
 return [
   {name:"Red",chance:red},
   {name:"Orange",chance:orange},
   {name:"Purple",chance:purple},
   {name:"Green",chance:green},
   {name:"Lime",chance:lime}
 ].sort((a,b)=>b.chance-a.chance);
}
function updateChancePanel(){
 if(chanceListEl)chanceListEl.innerHTML=getSpawnChances()
   .map(x=>`<div>${x.name}: ${(x.chance*100).toFixed(1)}%</div>`).join("");
}
function updateGameTimer(){
 if(gameOver)return;
 const seconds=Math.floor((Date.now()-gameStartTime)/1000);
 const mins=Math.floor(seconds/60),secs=seconds%60;
 timerEl.textContent="Time: "+String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0");
 updateChancePanel();
 const spawnSeconds=Math.max(1,3-Math.floor(seconds/300));
 if(spawnTextEl)spawnTextEl.textContent="Spawn: "+spawnSeconds+"s";
 if(seconds>=60&&!notifiedMinutes[1]){notifiedMinutes[1]=true;showNotification("1 MINUTE! Spawn chances increased!");tone(660,.15,"square",.08);}
 if(seconds>=300&&!notifiedMinutes[5]){notifiedMinutes[5]=true;showNotification("5 MINUTES! Spawn time reduced to 2 seconds!");tone(880,.2,"square",.08);}
 if(seconds>=600&&!notifiedMinutes[10]){notifiedMinutes[10]=true;showNotification("10 MINUTES! Spawn time reduced to 1 second!");tone(990,.2,"square",.08);}
 if(seconds>=900&&!notifiedMinutes[15]){notifiedMinutes[15]=true;showNotification("15 MINUTES! Spawn chances increased!");tone(1100,.2,"square",.08);}
}
function showNotification(text){
 notificationEl.textContent=text;notificationEl.style.opacity="1";
 clearTimeout(notificationTimeout);
 notificationTimeout=setTimeout(()=>notificationEl.style.opacity="0",3500);
}

/* ============================================================
   START / END
   ============================================================ */
function startGame(){
 menu.style.display="none";
 loseScreen.style.display="none";
 gameScreen.style.display="block";
 score=0;damage=1;gameOver=false;enemies=[];
 game.innerHTML="<div id=\"timer\">Time: 00:00</div><div id=\"notification\"></div><div id=\"chancePanel\"><h3>Spawn chances</h3><div id=\"chanceList\"></div></div>";
 timerEl=document.getElementById("timer");
 notificationEl=document.getElementById("notification");
 chanceListEl=document.getElementById("chanceList");
 gameStartTime=Date.now();notifiedMinutes={};
 spawnTextEl=document.getElementById("spawnText");
 timerEl.textContent="Time: 00:00";
 updateUI();

 requestAnimationFrame(()=>{
   recomputeScale();
   clearInterval(timerInterval);
   timerInterval=setInterval(updateGameTimer,250);
   startMusic();
   clearInterval(spawnTimer);
   scheduleSpawns();
 });
}
function endGame(){
 gameOver=true;clearTimeout(spawnTimer);clearInterval(timerInterval);stopMusic();
 if(score>getHighscore())localStorage.setItem("destroySquaresHighscore",score);
 finalScoreEl.textContent=score;loseHighscoreEl.textContent=getHighscore();
 gameScreen.style.display="none";loseScreen.style.display="flex";
 enemies.forEach(e=>{
   if(e.teleportTimer) clearInterval(e.teleportTimer);
   if(e.moveTimer) clearInterval(e.moveTimer);
   if(e.healTimer) clearInterval(e.healTimer);
 });
}
function goToMenu(){
 clearTimeout(spawnTimer);clearInterval(timerInterval);stopMusic();
 enemies.forEach(e=>{
   if(e.teleportTimer) clearInterval(e.teleportTimer);
   if(e.moveTimer) clearInterval(e.moveTimer);
   if(e.healTimer) clearInterval(e.healTimer);
   e.element.remove();
 });
 enemies=[];
 loseScreen.style.display="none";gameScreen.style.display="none";menu.style.display="flex";updateMenu();
}

/* ============================================================
   EFFECTS
   ============================================================ */
function teleportEffect(x,y){
 const size = Math.round(70*SCALE);
 const fx=document.createElement("div");fx.className="teleportFX";
 fx.style.width=size+"px"; fx.style.height=size+"px";
 fx.style.left=(x-size/2)+"px"; fx.style.top=(y-size/2)+"px";
 game.appendChild(fx);
 setTimeout(()=>fx.remove(),500);
 tone(330,.08,"sine",.08);setTimeout(()=>tone(660,.12,"sine",.06),45);
}
function healEffect(x,y){
 const ringSize = Math.round(72*SCALE);
 const ring=document.createElement("div");
 ring.className="healFX";
 ring.style.width=ringSize+"px"; ring.style.height=ringSize+"px";
 ring.style.left=(x-ringSize/2)+"px"; ring.style.top=(y-ringSize/2)+"px";
 game.appendChild(ring);
 setTimeout(()=>ring.remove(),650);

 const cross=document.createElement("div");
 cross.className="healCross";
 cross.textContent="+2";
 cross.style.fontSize = Math.max(12, Math.round(26*SCALE))+"px";
 cross.style.left=(x-10*SCALE)+"px";
 cross.style.top=(y-20*SCALE)+"px";
 game.appendChild(cross);
 setTimeout(()=>cross.remove(),950);

 if(audioCtx){
   tone(587.33,.18,"sine",.10);
   setTimeout(()=>tone(880,.28,"sine",.08),90);
 }
}

/* ============================================================
   SPAWNING
   ============================================================ */
function scheduleSpawns(){
 const elapsed=Date.now()-gameStartTime;
 const interval=Math.max(1000,3000-Math.floor(elapsed/300000)*1000);
 spawnTimer=setTimeout(()=>{spawnEnemy();if(!gameOver)scheduleSpawns()},interval);
}

function spawnEnemy(){
 if(gameOver)return;
 if(enemies.length>=MAX_ALIVE){endGame();return}

 const roll=Math.random();
 let kind="red";
 const minutes=Math.floor((Date.now()-gameStartTime)/60000);
 const orangeChance=Math.min(0.01+minutes*0.01,0.49);
 const purpleChance=Math.min(minutes*0.005,0.25);
 const greenChance=Math.min(Math.max(0,minutes-1)*0.005,0.25);
 const limeChance = Math.min(Math.max(0,minutes-2)*0.0015, 0.08);
 const redChance = 1 - orangeChance - purpleChance - greenChance - limeChance;

 if(roll < redChance){kind="red"}
 else if(roll < redChance + orangeChance){kind="orange"}
 else if(roll < redChance + orangeChance + purpleChance){kind="purple"}
 else if(roll < redChance + orangeChance + purpleChance + greenChance){kind="green"}
 else { kind="lime" }

 const conf = scaledSizes[kind];
 const size = conf.size;
 const maxHealth = conf.health;
 const points = conf.points;

 const enemy=document.createElement("div");
 enemy.className="enemy "+kind;
 enemy.style.width  = size+"px";
 enemy.style.height = size+"px";

 const maxX = Math.max(0, game.clientWidth  - size);
 const maxY = Math.max(0, game.clientHeight - size - Math.round(20*SCALE));
 enemy.style.left = Math.max(0, Math.random()*maxX)+"px";
 enemy.style.top  = Math.max(0, Math.random()*maxY)+"px";

 const healthBar=document.createElement("div");
 healthBar.className="health";
 healthBar.style.height = Math.max(4, Math.round(7*SCALE))+"px";
 healthBar.style.bottom = (-Math.max(8, Math.round(15*SCALE)))+"px";
 const healthFill=document.createElement("div");
 healthFill.className="healthFill";
 healthBar.appendChild(healthFill);
 enemy.appendChild(healthBar);
 game.appendChild(enemy);

 const data={
   element:enemy, health:maxHealth, maxHealth, kind, points,
   healthFill, healthBar, size,
   lastHitTime: 0    // timestamp of last successful hit
 };
 enemies.push(data);updateUI();

 /* PURPLE teleport */
 if(kind==="purple"){
  data.teleportTimer=setInterval(()=>{
   if(gameOver||!enemy.parentNode){clearInterval(data.teleportTimer);return}
   const ox=enemy.offsetLeft+size/2,oy=enemy.offsetTop+size/2;
   teleportEffect(ox,oy);
   const mx = Math.max(0, game.clientWidth  - size);
   const my = Math.max(0, game.clientHeight - size - Math.round(20*SCALE));
   enemy.style.left=Math.max(0,Math.random()*mx)+"px";
   enemy.style.top =Math.max(0,Math.random()*my)+"px";
   teleportEffect(enemy.offsetLeft+size/2,enemy.offsetTop+size/2);
  },1000);
 }

 /* GREEN movement */
 if(kind==="green"){
  let vx=(Math.random()<.5?-1:1)*(3+Math.random()*2)*SCALE;
  let vy=(Math.random()<.5?-1:1)*(3+Math.random()*2)*SCALE;
  data.moveTimer=setInterval(()=>{
   if(gameOver||!enemy.parentNode){clearInterval(data.moveTimer);return}
   const mx = Math.max(0, game.clientWidth  - size);
   const my = Math.max(0, game.clientHeight - size - Math.round(20*SCALE));
   let x=enemy.offsetLeft+vx,y=enemy.offsetTop+vy;
   if(x<=0||x>=mx)vx*=-1;
   if(y<=0||y>=my)vy*=-1;
   enemy.style.left=Math.max(0,Math.min(mx,x))+"px";
   enemy.style.top =Math.max(0,Math.min(my,y))+"px";
  },30);
 }

 /* LIME self-heal */
 if(kind==="lime"){
   data.healTimer = setInterval(()=>{
     if(gameOver || !enemy.parentNode) { clearInterval(data.healTimer); return; }
     if(data.health < data.maxHealth){
       data.health = Math.min(data.maxHealth, data.health + 2);
       data.healthFill.style.width = (data.health/data.maxHealth*100)+"%";
       const cx = enemy.offsetLeft + size/2;
       const cy = enemy.offsetTop + size/2;
       healEffect(cx, cy);
       enemy.style.boxShadow = "0 0 42px #eaffb0";
       setTimeout(()=>{ if(enemy.parentNode) enemy.style.boxShadow = "0 0 26px #b3ff3b"; }, 180);
     }
   }, 2000);
 }

 /* CLICK / TAP — 500ms cooldown per enemy */
 function handleHit(e){
  if(e.cancelable) e.preventDefault();
  e.stopPropagation();
  if(gameOver) return;

  // ---- 500ms cooldown check ----
  const now = Date.now();
  if(now - data.lastHitTime < HIT_COOLDOWN_MS) return;
  data.lastHitTime = now;
  // ------------------------------

  data.health -= damage;
  if(data.health <= 0){
    if(data.teleportTimer) clearInterval(data.teleportTimer);
    if(data.moveTimer) clearInterval(data.moveTimer);
    if(data.healTimer) clearInterval(data.healTimer);
    enemy.remove();
    enemies = enemies.filter(x=>x!==data);
    score += data.points;
    updateUI();
  } else {
    data.healthFill.style.width=(data.health/data.maxHealth*100)+"%";
    enemy.style.transform="scale(.85)";
    setTimeout(()=>{if(enemy.parentNode)enemy.style.transform=""},80);
  }
 }

 // pointerdown is the most reliable single-fire input on
 // both desktop and mobile; it fires before click/touch.
 enemy.addEventListener("pointerdown", handleHit);
}

/* ============================================================
   INIT
   ============================================================ */
recomputeScale();
updateMenu();
window.addEventListener('load',()=>{
  recomputeScale();
  setTimeout(recomputeScale, 100);
});
</script>
</body>
</html>
